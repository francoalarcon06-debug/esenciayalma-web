<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfumes Yasna</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--rosa1:#f28ab3;--rosa2:#d1658e;--txt:#2b2327}
  *{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--txt)}
  /* NAV simple (opcional) */
  .nav{position:sticky;top:0;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);padding:10px 18px}
  .nav a{margin-left:18px;text-decoration:none;color:#412f35;font-weight:600}
  /* HERO con imagen de fondo */
  .hero{
    min-height:100vh; display:grid; place-items:center; text-align:center; padding:64px 16px;
    background:
      linear-gradient(to bottom, rgba(255,255,255,.08), rgba(255,255,255,.82)),
      url("assets/images/flores-inicio.png") center 35%/cover no-repeat;
  }
  .pill{display:inline-block;background:#fde9f0;padding:10px 16px;border-radius:999px;font-weight:700;margin-bottom:18px}
  .barra{width:min(900px,92%);height:68px;margin:0 auto 18px;border-radius:14px;background:linear-gradient(90deg,var(--rosa2),var(--rosa1));opacity:.95}
  h1{margin:18px auto 26px;max-width:980px;font-size:clamp(22px,3.2vw + .6rem,40px);line-height:1.25}
  .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 14px 30px rgba(0,0,0,.08)}
  .prim{color:#fff;background:linear-gradient(90deg,var(--rosa2),var(--rosa1))}
  .ghost{background:#fff;color:#46353b}
</style>
</head>
<body>
  <nav class="nav">
    <div style="max-width:1200px;margin:auto;text-align:right">
      <a href="#inicio">Inicio</a><a href="#catalogo">Catálogo</a><a href="#contacto">Contacto</a>
    </div>
  </nav>

  <header id="inicio" class="hero">
    <div>
      <div class="pill">✦ Fragancias inspiradas en marcas de lujo</div>
      <div class="barra" aria-hidden="true"></div>
      <h1>Descubre nuestra exclusiva colección de perfumes inspirados en las mejores fragancias del mundo</h1>
      <div class="cta">
        <a class="btn prim" href="#catalogo">Ver Catálogo</a>
        <a class="btn ghost" href="#contacto">Contactar ahora</a>
      </div>
    </div>
  </header>

  <!-- Secciones de ancla de ejemplo -->
  <section id="catalogo" style="max-width:1200px;margin:50px auto;padding:0 16px">
    <h2>Catálogo</h2>
    <p>…</p>
  </section>
  <footer id="contacto" style="background:#fff;border-top:1px solid #eee;padding:28px 16px">
    <div style="max-width:1200px;margin:auto">Contacto…</div>
  </footer>
</body>
</html>
