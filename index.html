<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Esencia y Alma – Fragancias inspiradas en marcas de lujo</title>
  <meta name="description" content="Descubre nuestra exclusiva colección de perfumes inspirados en las mejores fragancias del mundo.">

  <!-- Tipografías -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#fff; --text:#2b2b2b; --muted:#6b6b6b;
      --primary:#ea4c89; --primary-600:#d63d78; --primary-100:#fde3ee;
      --shadow:0 10px 30px rgba(0,0,0,.08);
      --hero-image:url('img/hero.jpg'); /* cambia por tu imagen si quieres */
    }
    *{box-sizing:border-box} html,body{margin:0}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--text);background:var(--bg);line-height:1.6}
    a{text-decoration:none;color:inherit}

    /* NAV */
    header{position:sticky;top:0;z-index:50;background:#ffffffcc;backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid #00000010}
    .container{width:min(1120px,92%);margin:0 auto}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
    .brand{font-family:"DM Serif Display",serif;font-size:24px;
      background:linear-gradient(90deg,#ff6aa8 0%,#c43c73 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .menu{display:flex;gap:26px}
    .menu a{font-weight:600;color:#3c3c3c}
    .menu a:hover{color:var(--primary)}

    /* HERO */
    .hero{position:relative;isolation:isolate;padding:84px 0 70px;
      background:radial-gradient(ellipse at 20% 0%,#fce9f2 0%,transparent 45%),
                 radial-gradient(ellipse at 80% 10%,#fdeef5 0%,transparent 45%),
                 linear-gradient(#fff,#fff)}
    .hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.18;
      background-image:var(--hero-image);background-size:cover;background-position:center}
    .center{text-align:center}
    .badge{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-weight:600;color:#7a7a7a}
    .dot{width:10px;height:10px;border-radius:50%;background:#f6c53d;display:inline-block}
    .hero-title{margin:22px 0 16px;font-family:"DM Serif Display",serif;font-size:clamp(34px,4.6vw,58px);line-height:1.08;color:#fff;
      background:linear-gradient(90deg,#ff6aa8 0%,#c43c73 100%);display:inline-block;padding:22px 28px;border-radius:18px;box-shadow:var(--shadow)}
    .hero-sub{color:#5b5b5b;font-size:clamp(16px,1.9vw,20px);max-width:920px;margin:0 auto 28px}
    .cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:4px}
    .btn{appearance:none;border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer;transition:transform .06s,box-shadow .2s,background .2s}
    .btn-primary{background:var(--primary);color:#fff;box-shadow:0 10px 24px rgba(234,76,137,.22)}
    .btn-primary:hover{background:var(--primary-600)}
    .btn-ghost{background:#fff;color:#2b2b2b;border:1px solid #00000010}
    .btn-ghost:hover{box-shadow:var(--shadow)}
  </style>
</head>
<body>

  <!-- NAV -->
  <header>
    <div class="container nav">
      <a class="brand" href="#inicio">Esencia y Alma</a>
      <nav class="menu">
        <a href="#inicio">Inicio</a>
        <a href="#catalogo">Catálogo</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- HERO -->
  <section id="inicio" class="hero">
    <div class="container center">
      <span class="badge"><span class="dot"></span>Fragancias inspiradas en marcas de lujo</span>
      <h1 class="hero-title">Esencia y Alma</h1>
      <p class="hero-sub">Descubre nuestra exclusiva colección de perfumes inspirados en las mejores fragancias del mundo.</p>
      <div class="cta">
        <a class="btn btn-primary" href="#catalogo">Ver Catálogo</a>
        <a class="btn btn-ghost" href="#contacto">Contactar ahora</a>
      </div>
    </div>
  </section>
