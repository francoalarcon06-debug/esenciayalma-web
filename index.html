<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Esencia y Alma</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{font-family:"Poppins",sans-serif;color:#1a1a1a;background:#fff}
a{text-decoration:none}
.nav{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;padding:0 32px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);z-index:10}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;gap:24px}
.brand-pill{display:inline-block;background:linear-gradient(90deg,#f09cbc,#e06395);color:#fff;border-radius:999px;padding:12px 28px;font-family:"Playfair Display",serif;font-weight:700}
.menu{display:flex;gap:36px;font-weight:600}
.menu a{color:#1a1a1a}
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;position:relative;background:url('assets/images/Flores%20inicio.png') center/cover no-repeat;background-color:#fdf7f9}
.hero::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.30)}
.hero>*{position:relative;z-index:1}
.badge{display:inline-block;background:rgba(255,255,255,.65);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.4);padding:10px 20px;border-radius:999px;font-weight:600;color:#7b3a52;box-shadow:0 8px 20px rgba(0,0,0,.08);margin-bottom:18px}
.pill{display:inline-block;background:linear-gradient(90deg,#f09cbc,#e06395);color:#fff;padding:28px 40px;border-radius:14px;font-size:36px;font-family:"Playfair Display",serif;font-weight:700;margin-bottom:22px;box-shadow:0 6px 18px rgba(224,99,149,.35)}
h1{font-size:22px;font-weight:600;max-width:900px;margin:0 auto 30px}
.actions{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:14px 26px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.08);transition:transform .2s ease,opacity .2s ease}
.btn-pink{background:#e86f9a;color:#fff}
.btn-white{background:#fff;color:#1a1a1a}
.btn:hover{transform:translateY(-2px);opacity:.9}
@media(max-width:900px){.pill{font-size:30px;padding:22px 32px}h1{font-size:20px;max-width:720px}.menu{gap:20px}}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <div class="brand-pill">Esencia y Alma</div>
    <div class="menu">
      <a href="#inicio">Inicio</a>
      <a href="#catalogo">Catálogo</a>
      <a href="#contacto">Contacto</a>
    </div>
  </div>
</nav>

<header id="inicio" class="hero">
  <div>
    <div class="badge">⭐ Fragancias inspiradas en marcas de lujo</div>
    <div class="pill">Esencia y Alma</div>
    <h1>Descubre nuestra exclusiva colección de perfumes inspirados en las mejores fragancias del mundo</h1>
    <div class="actions">
      <a href="#catalogo" class="btn btn-pink">Ver Catálogo</a>
      <a href="#contacto" class="btn btn-white">Contactar ahora</a>
    </div>
  </div>
</header>
</body>
</html>
