<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Esencia y Alma</title>

<!-- Carga robusta de fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* Reset y base */
  *{margin:0;box-sizing:border-box}
  html,body{height:100%}
  :root{
    --rosa1:#f09cbc; --rosa2:#e06395; --texto:#1a1a1a; --grisMenu:#3b3b3b;
  }
  body{
    font-family:"Poppins", Arial, Helvetica, sans-serif !important; /* fuerza Poppins en todo */
    font-weight:400;
    color:var(--texto);
    background:#fff;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-synthesis:none; /* no “inventar” bold/italic si no cargó */
  }
  a{text-decoration:none}

  /* Barra superior */
  .nav{
    position:fixed;inset:0 0 auto 0;height:64px;
    display:flex;align-items:center;padding:0 32px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(8px);z-index:10;border-bottom:1px solid rgba(0,0,0,.06);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;gap:24px}
  .brand-pill{
    display:inline-block;background:linear-gradient(90deg,var(--rosa1),var(--rosa2));
    color:#fff;border-radius:999px;padding:12px 28px;
    font-family:"Playfair Display", Georgia, "Times New Roman", serif !important; /* fuerza Playfair */
    font-weight:700;font-size:18px;line-height:1;font-synthesis:none;
  }
  .menu{display:flex;gap:36px;font-weight:600;font-size:17px;letter-spacing:.3px}
  .menu a{color:var(--grisMenu)}

  /* Hero */
  .hero{
    min-height:100vh;display:grid;place-items:center;text-align:center;position:relative;
    background:url('assets/images/Flores%20inicio.png') center/cover no-repeat;
    background-color:#fdf7f9;padding-top:64px;
  }
  .hero::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.30)}
  .hero>*{position:relative;z-index:1}
  .stack{display:flex;flex-direction:column;align-items:center;gap:14px}

  /* Badge (Poppins Medium ~15px) */
  .badge{
    display:inline-block;background:rgba(255,255,255,.65);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.42);padding:10px 20px;border-radius:999px;
    font-family:"Poppins", Arial, Helvetica, sans-serif !important;
    font-weight:500;font-size:15px;color:#5a2e3f;box-shadow:0 8px 20px rgba(0,0,0,.08);line-height:1.2;
  }

  /* Título principal dentro de la píldora */
  .pill{
    display:inline-block;background:linear-gradient(90deg,var(--rosa1),var(--rosa2));
    color:#fff;padding:28px 40px;border-radius:14px;
    font-family:"Playfair Display", Georgia, "Times New Roman", serif !important; /* Playfair sí o sí */
    font-weight:700;font-size:46px;line-height:1.1;
    box-shadow:0 6px 18px rgba(224,99,149,.35);font-synthesis:none;
  }

  /* Descripción (Poppins ~20px) */
  h1{
    font-family:"Poppins", Arial, Helvetica, sans-serif !important;
    font-size:20px;font-weight:500;color:#875e6a;max-width:980px;margin:22px auto 30px;line-height:1.7;
  }

  /* Botones (Poppins SemiBold 16px) */
  .actions{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
  .btn{
    border:0;border-radius:14px;padding:14px 26px;
    font-family:"Poppins", Arial, Helvetica, sans-serif !important;
    font-weight:600;font-size:16px;line-height:1.1;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:transform .2s ease,opacity .2s ease,box-shadow .2s ease;
  }
  .btn-pink{background:#e86f9a;color:#fff}
  .btn-white{background:#fff;color:#1a1a1a}
  .btn:hover{transform:translateY(-2px);opacity:.92;box-shadow:0 10px 24px rgba(0,0,0,.10)}

  /* Responsivo */
  @media (max-width:1024px){
    .pill{font-size:40px;padding:24px 36px}
    h1{font-size:19px;max-width:820px}
  }
  @media (max-width:900px){
    .menu{gap:22px;font-size:16px}
    .pill{font-size:36px;padding:22px 32px}
    h1{font-size:18px;max-width:720px}
  }
  @media (max-width:560px){
    .brand-pill{font-size:16px;padding:10px 22px}
    .pill{font-size:30px;padding:18px 26px}
    .badge{font-size:14px}
    h1{font-size:17px}
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="brand-pill">Esencia y Alma</div>
    <div class="menu">
      <a href="#inicio">Inicio</a>
      <a href="#catalogo">Catálogo</a>
      <a href="#contacto">Contacto</a>
    </div>
  </div>
</nav>

<header id="inicio" class="hero">
  <div class="stack">
    <div class="badge">⭐ Fragancias inspiradas en marcas de lujo</div>
    <div class="pill">Esencia y Alma</div>
    <h1>Descubre nuestra exclusiva colección de perfumes inspirados en las mejores fragancias del mundo</h1>
    <div class="actions">
      <a href="#catalogo" class="btn btn-pink">Ver Catálogo</a>
      <a href="#contacto" class="btn btn-white">Contactar ahora</a>
    </div>
  </div>
</header>

</body>
</html>
