<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Producto – Esencia y Alma</title>
  <meta name="description" content="Detalle del producto de Esencia y Alma.">
  <link rel="icon" type="image/png" href="assets/images/Favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/images/Favicon.png" sizes="180x180">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/product.css">

  <!-- Estilos mínimos para chips de variantes -->
  <style>
    .variant-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end; /* a la derecha debajo del título */
      margin: 6px 0 10px;
    }
    .variant-chip {
      appearance: none;
      border: 1px solid #ffd0e2;
      background: #fff;
      color: var(--text, #2b2b2b);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1;
      padding: 10px 12px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow, 0 10px 30px rgba(0,0,0,.08));
      transition: background .2s, border-color .2s, transform .06s;
    }
    .variant-chip:hover { border-color: #ffb2cf; transform: translateY(-1px); }
    .variant-chip:focus { outline: 2px solid #ff86b5; outline-offset: 2px; }
    .variant-chip[aria-pressed="true"] {
      background: #ffe4ef; /* rosado clarito activo */
      border-color: #ff86b5;
      font-weight: 600;
    }
    .variant-chip:disabled {
      opacity: .5; cursor: not-allowed; text-decoration: line-through;
    }
    /* Ajustes mobile: mantener todo legible y respirado */
    @media (max-width: 640px) {
      .variant-chips { justify-content: flex-start; } /* en móvil a la izquierda si el ancho es estrecho */
      .variant-chip { font-size: 13px; padding: 9px 11px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <header class="nav">
    <div class="container nav__inner">
      <a class="brand" href="index.html#inicio">Esencia y Alma</a>
      <nav class="menu">
        <!-- Solo Contacto, igual que en index y catálogo -->
        <a id="menu-contacto" href="#">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO -->
  <main class="product-main">
    <div class="container">
      <!-- Tarjeta del producto -->
      <section id="product" class="product">
        <!-- Botón dentro del recuadro blanco -->
        <a href="catalogo.html" class="btn btn-ghost crumb-btn inside">Volver al catálogo</a>
        <!-- El resto del contenido se inyecta por JS -->
        <!-- Contenedor que inyectaremos bajo el título una vez cargado el producto -->
        <div id="variantChipsMount" style="display:none;"></div>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer id="contacto" class="footer">
    <div class="container">
      <div class="footer__inner" style="align-items:flex-start;">
        <div class="footer__brand" style="max-width:640px;">
          <div style="
            width:260px;height:26px;border-radius:8px;margin:0 0 14px 0;
            background:linear-gradient(90deg,#ff6aa8 0%,#c43c73 100%);
            display:flex;align-items:center;justify-content:center;
            color:#fff;font-weight:700;">
            Esencia y Alma
          </div>
          <p style="margin:0;">Una colección de fragancias y artículos para el hogar creados para disfrutar la elegancia y armonía todos los días.</p>
        </div>
        <div class="footer__contact">
          <a class="btn btn-ghost" id="whatsapp-cta" target="_blank" href="#" style="display:inline-flex;align-items:center;gap:10px;">
            <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.65-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
            </svg>
            WhatsApp
          </a>
        </div>
      </div>
      <p class="center" style="margin-top:16px;">© 2025 Esencia y Alma. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/product.page.js"></script>
  <script>
    // WhatsApp unificado para footer y menú "Contacto"
    (function () {
      const PHONE = "56961114225";
      const MSG   = encodeURIComponent("¡Hola! Me interesa el catálogo de Esencia y Alma.");
      const wa    = `https://wa.me/${PHONE}?text=${MSG}`;

      // Botón WhatsApp del footer
      const waBtn = document.getElementById("whatsapp-cta");
      if (waBtn) {
        waBtn.href = wa;
        waBtn.target = "_blank";
        waBtn.rel = "noopener";
        waBtn.addEventListener("click", function (e) {
          // Por si algún estilo o script bloquea, forzamos la apertura
          e.preventDefault();
          window.open(wa, "_blank", "noopener");
        });
      }

      // Enlace "Contacto" del menú superior
      const menuContacto = document.getElementById("menu-contacto");
      if (menuContacto) {
        menuContacto.href = wa;
        menuContacto.target = "_blank";
        menuContacto.rel = "noopener";
        menuContacto.addEventListener("click", function (e) {
          e.preventDefault();
          window.open(wa, "_blank", "noopener");
        });
      }
    })();
  </script>

  <!-- Script para chips de variantes (no rompe nada si no hay variants) -->
  <script>
    (function () {
      const PRODUCT_SECTION = document.getElementById('product');
      const MOUNT_PLACEHOLDER = document.getElementById('variantChipsMount');

      // Utilidades
      const fmtCLP = (n) => {
        const num = typeof n === 'string' ? parseInt(n, 10) : n;
        return new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(num);
      };
      const qs = (sel, root=document) => root.querySelector(sel);
      const qsa = (sel, root=document) => Array.from(root.querySelectorAll(sel));

      // Obtiene el índice del producto desde la URL (?c=women&i=1)
      function getParams() {
        const p = new URLSearchParams(location.search);
        return { c: p.get('c') || p.get('scope') || 'women', i: parseInt(p.get('i') || '0', 10) };
      }

      // Busca elementos de título, precio y botón WhatsApp dentro del bloque renderizado
      function findTitleEl() {
        return qs('#product h1, #product .product__title, #product [data-title]');
      }
      function findPriceEl() {
        // intentos comunes
        return qs('#product [data-price], #product .product__price, #product .price, #product h3, #product .price-value');
      }
      function findWhatsAppBtnInCard() {
        // botón "Consultar por WhatsApp" dentro de la tarjeta
        const links = qsa('#product a, #product button');
        return links.find(el => /whatsapp/i.test(el.textContent || ''));
      }

      // Espera a que product.page.js termine de inyectar el HTML
      function waitForRender(timeoutMs = 4000) {
        return new Promise((resolve) => {
          const start = performance.now();
          const iv = setInterval(() => {
            const title = findTitleEl();
            const price = findPriceEl();
            if (title && price) {
              clearInterval(iv);
              resolve({ title, price });
            } else if (performance.now() - start > timeoutMs) {
              clearInterval(iv);
              resolve({ title, price });
            }
          }, 60);
        });
      }

      async function initVariants() {
        const { c, i } = getParams();

        // Carga data/products.json para leer las variantes del producto
        let data;
        try {
          const res = await fetch('data/products.json', { cache: 'no-store' });
          data = await res.json();
        } catch (e) {
          return; // si falla, no hacemos nada
        }

        const list = data?.[c] || [];
        const product = list?.[i];
        if (!product || !Array.isArray(product.variants) || product.variants.length === 0) {
          return; // sin variants => no renderizamos chips
        }

        // Espera a que se renderice la tarjeta
        const { title, price } = await waitForRender();
        if (!title || !price) return;

        // Monto por defecto: 100ml si existe; si no, el primero
        const defaultIdx = product.variants.findIndex(v => Number(v.ml) === 100);
        let current = defaultIdx >= 0 ? product.variants[defaultIdx] : product.variants[0];

        // Construir barra de chips
        const bar = document.createElement('div');
        bar.className = 'variant-chips';
        product.variants.forEach((v, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'variant-chip';
          btn.textContent = `${v.ml} ml`;
          const isActive = (Number(v.ml) === Number(current.ml));
          btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');

          btn.addEventListener('click', () => {
            current = v;
            // actualizar estados visuales
            qsa('.variant-chip', bar).forEach(b => b.setAttribute('aria-pressed', 'false'));
            btn.setAttribute('aria-pressed', 'true');
            // actualizar precio mostrado
            price.textContent = fmtCLP(v.price);
            // actualizar WhatsApp del card (si existe)
            const waBtn = findWhatsAppBtnInCard();
            if (waBtn && waBtn.href) {
              try {
                const url = new URL(waBtn.href);
                const baseText = "¡Hola! Me interesa este producto";
                const name = product.name || (title.textContent || '').trim();
                const msg = `${baseText}: ${name} (${v.ml} ml) – ${fmtCLP(v.price)}`;
                url.searchParams.set('text', msg);
                waBtn.href = url.toString();
              } catch (e) { /* noop */ }
            }
          });

          bar.appendChild(btn);
        });

        // Insertar la barra justo debajo del título
        if (title.parentNode) {
          title.parentNode.insertBefore(bar, title.nextSibling);
        } else {
          // Fallback: usamos el placeholder dentro de #product
          MOUNT_PLACEHOLDER.style.display = 'block';
          MOUNT_PLACEHOLDER.appendChild(bar);
        }

        // Setear precio inicial según la variante por defecto
        price.textContent = fmtCLP(current.price);

        // También ajustar el botón de WhatsApp inicial del card
        const waBtnInitial = findWhatsAppBtnInCard();
        if (waBtnInitial && waBtnInitial.href) {
          try {
            const url = new URL(waBtnInitial.href);
            const baseText = "¡Hola! Me interesa este producto";
            const name = product.name || (title.textContent || '').trim();
            const msg = `${baseText}: ${name} (${current.ml} ml) – ${fmtCLP(current.price)}`;
            url.searchParams.set('text', msg);
            waBtnInitial.href = url.toString();
          } catch (e) { /* noop */ }
        }
      }

      // Inicia cuando el DOM está listo
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initVariants);
      } else {
        initVariants();
      }
    })();
  </script>
</body>
</html>
